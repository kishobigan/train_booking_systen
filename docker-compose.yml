x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/train_booking
  NODE_ENV: production

x-backend-build: &backend-build
  context: ./backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: train_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: train_booking
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d train_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: *backend-build
    command: npm run db:migrate
    restart: "no"
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap-super-admin:
    build: *backend-build
    command: npm run bootstrap:super-admin
    restart: "no"
    env_file:
      - ./backend/.env.example
    environment:
      <<: *backend-environment
      ALLOW_DATABASE_SEED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build: *backend-build
    command: npm start
    container_name: train_booking_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    ports:
      - "4050:4050"
    volumes:
      - bank_slips:/app/storage/bank-slips
    environment:
      <<: *backend-environment
      PORT: 4050
      JOBS_ENABLED: "false"
    depends_on:
      bootstrap-super-admin:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/api/v1/health').then(r=>{if(!r.ok)throw new Error(r.status)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  bootstrap:
    build: *backend-build
    command: npm run db:bootstrap
    restart: "no"
    env_file:
      - ./backend/.env.example
    environment:
      <<: *backend-environment
      ALLOW_DATABASE_SEED: "true"
      BOOTSTRAP_API_BASE_URL: http://backend:4050/api/v1
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build: *backend-build
    command: npm run start:worker
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      <<: *backend-environment
      JOBS_ENABLED: "true"
      JOB_HEALTH_PORT: 4051
    volumes:
      - bank_slips:/app/storage/bank-slips
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.JOB_HEALTH_PORT+'/ready').then(r=>{if(!r.ok)throw new Error(r.status)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4050/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4050}
        NEXT_PUBLIC_WS_PATH: ${NEXT_PUBLIC_WS_PATH:-/socket.io}
    container_name: train_booking_frontend
    restart: unless-stopped
    ports:
      - "3050:3050"
    environment:
      PORT: 3050
      HOSTNAME: "0.0.0.0"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/').then(r=>{if(!r.ok)throw new Error(r.status)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  smoke-test:
    build: *backend-build
    command: node scripts/smoke-test.js
    restart: "no"
    env_file:
      - ./backend/.env.example
      - ./frontend/.env.example
    environment:
      <<: *backend-environment
      PORT: 3050
    depends_on:
      worker:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  bank_slips:
